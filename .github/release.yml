changelog:
  exclude:
    authors:
      - "dependabot[bot]"
    labels:
      - dependencies
  categories:
    - title: "💔 Breaking Change"
      labels:
        - "💔 breaking"
    - title: "🚀 Added"
      labels:
        - "🚀 enhancement"
    - title: "🐞 Fixed"
      labels:
        - "🐞 bug"
    - title: "💨 Changed"
      labels:
        - "*"
    - title: "📜 Docs"
      labels:
        - "📝 documentation"
