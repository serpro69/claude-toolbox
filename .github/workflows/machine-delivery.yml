---
name: Machine delivery tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Guard engine
        run: bash test/test-guard.sh
      - name: Codex adapters
        env:
          KK_GUARD_INTERPRETERS: ${{ steps.python.outputs.python-path }}
        run: bash test/test-codex-hooks.sh
      - name: kk lifecycle and packaged guard self-tests
        run: bash test/test-kk.sh
