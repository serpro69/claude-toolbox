---
name: Generated Artifacts Check

on:
  pull_request:
    paths:
      - '.github/workflows/generated-check.yml'
      - '.claude/toolbox/scripts/template-sync.sh'
      - 'klaude-plugin/**'
      - 'kodex-plugin/**'
      - 'kodex-guard/**'
      - '.agents/plugins/marketplace.json'
      - 'kk/baseline/codex/kk.rules'
      - 'kk/baseline/claude/deny.json'
      - 'kk/baseline/codex/agents/**'
      - 'cmd/generate-kodex/**'
      - 'scripts/generate-guard.sh'
      - 'scripts/kodex-generate-manifest.yml'
      - 'docs/user-guide/configuration.md'
      - 'test/**'
      - 'Makefile'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify legacy sync handoff
        run: bash test/test-template-sync.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Regenerate and check freshness
        run: |
          make check-guard
          make generate-kodex
          generated=(kodex-plugin kk/baseline/codex/agents)
          git diff --exit-code -- "${generated[@]}"
          test -z "$(git ls-files --others --exclude-standard -- "${generated[@]}")"
      - name: Test guard generator
        run: bash test/test-generate-guard.sh
